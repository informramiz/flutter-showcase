name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true
      # drift's tests run against the host SQLite library.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs --force-jit
      - run: flutter analyze
      - run: dart run custom_lint
      # Goldens are rendered on macOS; font rasterisation differs on Linux.
      - run: flutter test --coverage --exclude-tags golden
      - run: tool/check_coverage.sh 80
      - run: flutter build web --release

  goldens:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs --force-jit
      - run: flutter test --tags golden
